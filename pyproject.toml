[build-system]
requires = [
	"setuptools >= 75.0",
	"setuptools-scm >= 9.2.2, < 10",
]
build-backend = "setuptools.build_meta"


[project]
name = "rcp-task-acquisition"
dynamic = ["version", "dependencies"]
readme = "README.md"
requires-python = ">= 3.10, < 3.13, != 3.11"
[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
dev = [
	"spyder >= 6.1.3, < 7",  # IDE
	"ruff >= 0.16, < 1",
	"pre-commit >= 4.6, < 5",
	"rcp-task-acquisition[test]",
]
test = [
	"pytest >= 9, < 10",
	"pytest-random-order >= 1.2.0, < 2",
	"coverage >= 7.15.0, < 8",
]

[project.scripts]
rcp-task-acquisition = "rcp_task_acquisition.__main__:run_app"
create-shortcut = "rcp_task_acquisition.utils.shortcut:create_shortcut"
deidentify-data = "rcp_task_acquisition.utils.deidentify_dates:run_all_dates"


[tool.ruff]
line-length = 100

lint.ignore = [
	"FURB171"  # Ignore the "add-unicode-string" rule
]

[tool.ruff.format]
quote-style = "double"  # or single or preserve. prefer double.
indent-style = "space"
line-ending = "auto"  # cr-lf
docstring-code-format = true

[tool.setuptools_scm]
# section needs to be present, even if empty
