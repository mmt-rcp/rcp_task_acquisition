name: Build and test
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      FORCE_COLOR: 1
    # The matrix defines the runners and Python versions dynamically
    strategy:
      fail-fast: true
      matrix:
        # this creates 3 sub-jobs:
        os: [windows-latest]
        python-version: ["3.10", "3.12"]
        include:
          - os: ubuntu-24.04
            python-version: "3.12"
            experimental: true
#    permissions:
#      contents: write
    steps:
    - name: Windows pre-install
      if: matrix.os == 'windows-latest'
      run: winget install VideoLAN.VLC --silent --accept-source-agreements --accept-package-agreements
    - name: Linux pre-install
      if: matrix.os != 'windows-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev vlc python3-wxgtk4.0 python3-pyaudio
        # libgtk-3-dev build-essential
        # portaudio19 required for build of pyaudio.
        # gtk-3 for wxpython
    - uses: actions/checkout@v4
      with:
        fetch-depth: '0'
        lfs: true
    - name: Show files
      shell: bash
      run: ls -lt ./library
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # Automatically caches your packages to speed up builds
    - name: Use system python distribution packages
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        set -x
        which python pip
        # pip wheel --no-deps esprima
        # mv *.whl library/
        pip list
        pip install -U setuptools
        /usr/bin/python3 -V
        /usr/bin/python3 -m site
        /usr/bin/python3 -m pip list
        systemsitepkgdir=/usr/lib/python3/dist-packages  #  $(/usr/bin/python3 -c "import site; print(site.getsitepackages()[-1])") 
        python -V
        python -m site
        sitepkgdir=$(python -c "import site; print(site.getsitepackages()[-1])")
        # usersite=$(python -c "import site; print(site.USER_SITE)")
        cat << END > "${sitepkgdir}/_load_system.pth"
        import sys; sys.path.insert(len(sys.path) - 1, '${systemsitepkgdir}'); sys.path.insert(0, '${sitepkgdir}')
        END
        python -m site
        pip list
        sudo chown -R "$USER" "${systemsitepkgdir}"
    - name: Prepare build
      run: pip install build
    - name: Build wheel
      shell: bash
      run: |
        rm -rf dist
        python -m build -w -o dist .
    - name: Build Result
      shell: bash
      run: |
        ls -lth ./dist
        unzip -l ./dist/*.whl || true
    - name: Install as editable
      shell: bash
      run: |
        # pip install --find-links ./library $(ls ./dist/*.whl)[test]
        pip install --find-links ./library -e .[test]
        # NB: for now need install as editable, for inline config files
    - name: Install Result
      run: |
        pip list
    - name: Patch temporary python-vlc
      run: python library/patch_python_vlc.py
    - name: Execute tests
      shell: bash
      run: |
        pytest -v ./tests
